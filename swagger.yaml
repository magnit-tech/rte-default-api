              transfer_code:
                type: string
                description: |
                  Для точки с типом source - код для получения заказа в магазине (курьер называет код сборщику)
                  Для точки с типом destination - код для передачи заказ клиенту (клиент называет код курьеру из смс)
                example: "132443"
                maxLength: 8
              address:
