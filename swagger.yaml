openapi: 3.0.1
info:
  title: Last Mile OMS service API
  description: Last Mile OMS service API
  contact: {}
  version: 0.5.5
servers:
  - url: https://b2b-api-gateway.uat.ya.magnit.ru/api/
    description: Демо сервер для проведения тестирования интеграции.
  - url: https://b2b-api.magnit.ru/api/
    description: Основной сервер интеграции.
paths:
  /api/v1/Blocks/list:
    get:
      description: "[В разработке]Получение списка заблокированных ресторанов"
      tags:
        - Blocks
      parameters:
        - name: storeId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GetStoreBlocksResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/GetStoreBlocksResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/GetStoreBlocksResponse'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/Blocks/block:
    post:
      description: "[В разработке] Временная блокировка ресторана"
      tags:
        - Blocks
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/BlockStoreRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/BlockStoreRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/BlockStoreRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/BlockStoreRequest'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/BlockStoreResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/BlockStoreResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/BlockStoreResponse'
  /api/v1/Blocks/unblock:
    post:
      description: "[В разработке] Разблокировка ресторана"
      tags:
        - Blocks
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/UnblockStoreRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UnblockStoreRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UnblockStoreRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UnblockStoreRequest'
      responses:
        '204':
          description: Success
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/Menus/{restaurantId}:
    get:
      tags:
        - Menus
      summary: "Получение меню."
      parameters:
        - name: restaurantId
          in: path
          description: "Идентификатор ресторана"
          required: true
          schema:
            type: string
          example: '74013271'
      responses:
        '200':
          description: "Меню"
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Menu'
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
            text/json:
              schema:
                $ref: '#/components/schemas/Menu'
        5XX:
          description: Server error
  /api/v1/Orders/{restaurantId}/{orderId}:
    get:
      tags:
        - Orders
      summary: ''
      parameters:
        - name: restaurantId
          in: path
          description: "Идентификатор ресторана в системе партнера"
          required: true
          schema:
            type: string
          example: '74013271'
        - name: orderId
          in: path
          description: "Идентификатор заказа в системе партнера"
          example: "o111222333"
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OrderWithRejectingReason'
            application/json:
              schema:
                $ref: '#/components/schemas/OrderWithRejectingReason'
            text/json:
              schema:
                $ref: '#/components/schemas/OrderWithRejectingReason'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags:
        - Orders
      summary: ''
      parameters:
        - name: restaurantId
          in: path
          description: "Идентификатор ресторана в системе партнера"
          required: true
          schema:
            type: string
          example: '74013271'
        - name: orderId
          in: path
          description: "Идентификатор заказа в системе партнера"
          example: "o111222333"
          required: true
          schema:
            type: string
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateOrder'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrder'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateOrder'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateOrder'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OrderWithId'
            application/json:
              schema:
                $ref: '#/components/schemas/OrderWithId'
            text/json:
              schema:
                $ref: '#/components/schemas/OrderWithId'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/Orders/{restaurantId}:
    post:
      tags:
        - Orders
      summary: "Метод создания заказа в ресторане"
      parameters:
        - name: restaurantId
          in: path
          description: "Уникальный идентификатор ресторана"
          required: true
          schema:
            type: string
          example: '74013271'
      requestBody:
        description: ''
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
            example:
              originalOrderId: 86c48784-b7af-4b66-8c05-348005d38a1a
              preOrder: false
              createdAt: '2024-07-04T15:41:36.7495617Z'
              customer:
                name: Customer Name
                phone: '+71111111111'
                email: test@test.test
              payment:
                type: online
              expeditionType: pickup
              pickup:
                expectedTime: '2024-07-04T16:11:36.7498005Z'
                taker: courier
              products:
                - id: '9000903'
                  name: Баскет Дуэт с острыми стрипсами
                  price: 409
                  quantity: 1
                  ingredients: [ ]
              promotions: [ ]
              comment: Customer comment
              price:
                total: 409
                deliveryFee: 149
                discount: 0
              personsQuantity: 1
              callCenter:
                phone: CallCenter Phone
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
            example:
              originalOrderId: 86c48784-b7af-4b66-8c05-348005d38a1a
              preOrder: false
              createdAt: '2024-07-04T15:41:36.7495617Z'
              customer:
                name: Customer Name
                phone: '+71111111111'
                email: test@test.test
              payment:
                type: online
              expeditionType: pickup
              pickup:
                expectedTime: '2024-07-04T16:11:36.7498005Z'
                taker: courier
              products:
                - id: '9000903'
                  name: Баскет Дуэт с острыми стрипсами
                  price: 409
                  quantity: 1
                  ingredients: [ ]
              promotions: [ ]
              comment: Customer comment
              price:
                total: 409
                deliveryFee: 149
                discount: 0
              personsQuantity: 1
              callCenter:
                phone: CallCenter Phone
          text/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
            example:
              originalOrderId: 86c48784-b7af-4b66-8c05-348005d38a1a
              preOrder: false
              createdAt: '2024-07-04T15:41:36.7495617Z'
              customer:
                name: Customer Name
                phone: '+71111111111'
                email: test@test.test
              payment:
                type: online
              expeditionType: pickup
              pickup:
                expectedTime: '2024-07-04T16:11:36.7498005Z'
                taker: courier
              products:
                - id: '9000903'
                  name: Баскет Дуэт с острыми стрипсами
                  price: 409
                  quantity: 1
                  ingredients: [ ]
              promotions: [ ]
              comment: Customer comment
              price:
                total: 409
                deliveryFee: 149
                discount: 0
              personsQuantity: 1
              callCenter:
                phone: CallCenter Phone
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
            example:
              originalOrderId: 86c48784-b7af-4b66-8c05-348005d38a1a
              preOrder: false
              createdAt: '2024-07-04T15:41:36.7495617Z'
              customer:
                name: Customer Name
                phone: '+71111111111'
                email: test@test.test
              payment:
                type: online
              expeditionType: pickup
              pickup:
                expectedTime: '2024-07-04T16:11:36.7498005Z'
                taker: courier
              products:
                - id: '9000903'
                  name: Баскет Дуэт с острыми стрипсами
                  price: 409
                  quantity: 1
                  ingredients: [ ]
              promotions: [ ]
              comment: Customer comment
              price:
                total: 409
                deliveryFee: 149
                discount: 0
              personsQuantity: 1
              callCenter:
                phone: CallCenter Phone
      responses:
        '201':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OrderWithId'
            application/json:
              schema:
                $ref: '#/components/schemas/OrderWithId'
            text/json:
              schema:
                $ref: '#/components/schemas/OrderWithId'
        '400':
          description: Bad Request
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/RejectingReason'
            application/json:
              schema:
                $ref: '#/components/schemas/RejectingReason'
            text/json:
              schema:
                $ref: '#/components/schemas/RejectingReason'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/StopLists/{restaurantId}:
    get:
      tags:
        - StopLists
      summary: "Стоплисты для блюд. Даже если блюдо находится в стоплисте, его необходимо передавай в основном меню"
      parameters:
        - name: restaurantId
          in: path
          description: ''
          required: true
          schema:
            type: string
          example: '74013271'
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Response'
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
            text/json:
              schema:
                $ref: '#/components/schemas/Response'


components:
  schemas:
    OrderStatus:
      enum:
        - created
        - accepted
        - restaurant_cancelled
        - customer_cancelled
        - picked_up
        - delivered
        - on_the_way
        - courier_cancelled
        - cooking
        - ready
        - courier_is_close_to_restaurant
        - courier_at_restaurant
      type: string
      description: "created - новый заказ, accepted - заказ принят, restaurant_cancelled - отменен рестораном, customer_cancelled - отменен клиентом, picked_up - произведен самовывоз, delivered - заказ доставлен, on_the_way - заказ готов и находится в пути, \r\n            courier_cancelled -отмена заказа курьером, cooking - заказ готовится, ready - заказ  готов, courier_is_close_to_restaurant - курьер на подходе к ресторану, courier_at_restaurant - курьер в ресторане"

    Address:
      required:
        - city
        - coordinates
      type: object
      properties:
        subway:
          maxLength: 64
          minLength: 0
          type: string
        region:
          maxLength: 255
          minLength: 0
          type: string
        city:
          $ref: '#/components/schemas/City'
        street:
          $ref: '#/components/schemas/Street'
        houseNumber:
          type: string
          nullable: true
        flatNumber:
          type: string
          nullable: true
        entrance:
          type: string
          nullable: true
        intercom:
          type: string
          nullable: true
        floor:
          type: string
          nullable: true
        coordinates:
          $ref: '#/components/schemas/Coordinates'
      additionalProperties: false
    BlockItem:
      type: object
      properties:
        id:
          type: string
          nullable: true
        storeId:
          type: string
          nullable: true
        blockId:
          type: string
          nullable: true
        startsAt:
          type: string
          nullable: true
          example: '2024-07-04T15:41:36.7495617Z'
        endsAt:
          type: string
          nullable: true
          example: '2024-07-04T15:41:36.7495617Z'
        reason:
          type: string
          nullable: true
      additionalProperties: false
    BlockStoreRequest:
      required:
        - blockId
        - comment
        - endsAt
        - startsAt
        - storeId
      type: object
      properties:
        storeId:
          type: string
        blockId:
          type: string
        startsAt:
          type: string
          example: '2024-07-04T15:41:36.7495617Z'
        endsAt:
          type: string
          example: '2024-07-04T15:41:36.7495617Z'
        comment:
          type: string
      additionalProperties: false
    BlockStoreResponse:
      type: object
      properties:
        id:
          type: string
          nullable: true
        storeId:
          type: string
          nullable: true
        blockId:
          type: string
          nullable: true
        startsAt:
          type: string
          nullable: true
          example: '2024-07-04T15:41:36.7495617Z'
        endsAt:
          type: string
          nullable: true
          example: '2024-07-04T15:41:36.7495617Z'
        reason:
          type: string
          nullable: true
      additionalProperties: false
    CallCenter:
      description: "Данные коллцентра для связи при проблемах с заказом"
      required:
        - phone
      type: object
      properties:
        phone:
          description: "Контактный телефон Коллцентра"
          example: "88005553535"
          maxLength: 16
          minLength: 0
          type: string
      additionalProperties: false
    Category:
      required:
        - id
        - name
      type: object
      properties:
        id:
          description: "Уникальный идентификатор категории"
          example: "a10"
          maxLength: 128
          minLength: 0
          type: string
        parentId:
          description: "Родительская категория для вложенных категорий (сейчас не используется, не заполнять)"
          maxLength: 128
          minLength: 0
          type: string
        name:
          description: "Наименование категории"
          example: "Пицца"
          maxLength: 256
          minLength: 0
          type: string
      additionalProperties: false
    CategoryProduct:
      description: "Сортировка блюд в рамках категории"
      required:
        - categoryId
        - order
        - productId
      type: object
      properties:
        productId:
          maxLength: 128
          minLength: 0
          type: string
          description: "Идентификатор блюда"
          example: "27973"
        categoryId:
          maxLength: 128
          minLength: 0
          type: string
          description: "Идентификатор категории"
          example: "a10"
        order:
          type: integer
          format: int32
          description: "Позиция блюда внутри категории. Чем меньше значение - тем выше блюдо находится в списке внутри категории. Минимальное значение 0"
      additionalProperties: false
    City:
      required:
        - name
      type: object
      properties:
        name:
          maxLength: 128
          minLength: 0
          type: string
        code:
          maxLength: 128
          minLength: 0
          type: string
      additionalProperties: false
    CreateOrder:
      required:
        - callCenter
        - createdAt
        - customer
        - expeditionType
        - originalOrderId
        - payment
        - personsQuantity
        - preOrder
        - price
        - products
      type: object
      properties:
        originalOrderId:
          maxLength: 128
          minLength: 0
          type: string
          description: "Идентификатор заказа созданный на стороне агрегатора"
        preOrder:
          type: boolean
        createdAt:
          type: string
          example: '2024-07-04T15:41:36.7495617Z'
        customer:
          $ref: '#/components/schemas/Customer'
        payment:
          $ref: '#/components/schemas/Payment'
        expeditionType:
          enum:
            - delivery
            - pickup
          type: string
          description: "При delivery - доставляет вендор, 
            при pickup доставляет или курьер Магнит, или покупатель (смотри поле taker)"
        delivery:
          $ref: '#/components/schemas/Delivery'
        pickup:
          $ref: '#/components/schemas/Pickup'
        products:
          type: array
          description: "Список блюд в заказе"
          items:
            $ref: '#/components/schemas/OrderProduct'
        promotions:
          type: array
          description: "Список промоакций примененных к заказу (пока не используется)"
          items:
            $ref: '#/components/schemas/OrderPromotion'
        comment:
          type: string
          description: "Комментарий клиента к заказу"
          example: "Сделайте красиво, пожалуйста"
        price:
          $ref: '#/components/schemas/Price'
        personsQuantity:
          type: integer
          format: int32
          description: "Количество персон"
          example: 5
        callCenter:
          $ref: '#/components/schemas/CallCenter'
      additionalProperties: false
    Customer:
      required:
        - name
      type: object
      properties:
        name:
          description: "Имя клиента"
          example: "Игорь"
          maxLength: 64
          minLength: 0
          type: string
        phone:
          description: "Контактный телефон курьера. Сейчас передается телефон коллцентра, позже будет подменный номер клиента"
          example: "Игорь"
          maxLength: 16
          minLength: 0
          type: string
        extensionNumber:
          maxLength: 16
          minLength: 0
          type: string
          nullable: true
          description: "Добавочный номер (пока не используется)"
        email:
          type: string
          format: email
          nullable: true
          description: "Email клиента"
      additionalProperties: false
    Delivery:
      description: "Адрес доставки"
      required:
        - address
        - expectedTime
      type: object
      properties:
        expectedTime:
          type: string
        address:
          $ref: '#/components/schemas/Address'
      additionalProperties: false
    GetStoreBlocksResponse:
      type: object
      properties:
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/BlockItem'
          nullable: true
      additionalProperties: false
    GroupIngredient:
      required:
        - id
        - isExcisable
        - name
        - price
      type: object
      properties:
        id:
          maxLength: 128
          minLength: 0
          type: string
          example: "gi13"
          description: "Уникальный идентификатор группы ингредиентов"
        name:
          maxLength: 256
          minLength: 0
          type: string
          description: "Название группы ингредиентов"
          example: "Топпинги"
        price:
          type: number
          format: double
          example: 25
        vat:
          type: integer
          description: "Ставка НДС (0, 5, 7, 10, 20 (deprecated), 22). Если не будет передана, то унаследуется от блюда к которому привязана группа ингредиентов"
          format: int32
          example: 10
        isExcisable:
          type: boolean
          description: "Признак подакцизного ингредиента"
        productId:
          type: string
          description: "Идентификатор продукта, к которому привязана группа ингредиентов"
          example: "27973"
      additionalProperties: false
    Ingredient:
      required:
        - id
        - name
        - price
      type: object
      properties:
        id:
          maxLength: 128
          minLength: 0
          type: string
          description: "Уникальный идентификатор ингредиента"
          example: "i25"
        name:
          maxLength: 256
          minLength: 0
          type: string
          description: "Название ингредиента"
          example: "Сметана 50г"
        price:
          type: number
          format: double
          description: "Цена за единицу ингредиента"
          example: 20.5
        vat:
          type: integer
          description: "Ставка НДС (0, 5, 7, 10, 20 (deprecated), 22). Если не будет передана, то унаследуется от блюда к которому привязан ингредиент"
          format: int32
          example: 10
      additionalProperties: false
    IngredientsGroup:
      required:
        - ingredients
        - name
      type: object
      description: "Указывается группа ингредиентов, в рамках которой обязательно надо выбрать 1 вариант"
      properties:
        name:
          maxLength: 256
          minLength: 0
          type: string
          description: "Название группы ингредиентов"
          example: "Топпинги"
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/GroupIngredient'
      additionalProperties: false
    Menu:
      required:
        - lastUpdatedAt
        - menuItems
      type: object
      properties:
        lastUpdatedAt:
          description: "Дата/время последнего изменения меню. Меню не будет обновляться если дата в ответе сервера не отличается от даты последнего обновления меню"
          type: string
